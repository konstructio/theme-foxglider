<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foxglider</title>
<link rel="icon" href="foxglider.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#12161d; --panel:#171c24; --panel2:#1b212b; --line:#262e3a; --line2:#394454;
    --ink:#f3f5f7; --ink2:#c7ced3; --mut:#9fafbc; --mut2:#5b6c7c;
    --gl-red:#E24329; --gl-orange:#FC6D26; --gl-amber:#FCA326;
    --civo:#05df72; --civo2:#00c950; --manual:#8b93a7;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  a{color:var(--civo);text-decoration:none} a:hover{color:var(--civo2)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 24px 56px}
  .mono{font-family:var(--mono)} .mut{color:var(--mut)} .spacer{flex:1}
  header{display:flex;align-items:center;gap:12px 16px;padding:12px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;color:var(--ink);font-size:15px}
  .tabs{display:flex;gap:4px}
  .tab{padding:5px 12px;border-radius:5px;color:var(--mut);font-size:13px}
  .tab.on{background:var(--panel2);color:var(--ink)}
  #window{background:var(--panel);color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12px}
  #updated{font-size:11px}
  .orgchip{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:2px 7px;display:inline-flex;align-items:center;gap:6px}
  .orglogo{width:15px;height:15px;border-radius:3px;object-fit:cover}
  .section-h{display:flex;align-items:center;gap:12px;margin:30px 0 10px;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--gl-amber);font-weight:700}
  .section-h span{flex:1;height:1px;background:var(--line)}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
  .row-head{display:flex;align-items:center;gap:8px 12px;margin-bottom:8px;flex-wrap:wrap}
  .pname{color:var(--ink);font-weight:700}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--c);border:1px solid var(--c);border-radius:3px;padding:2px 7px}
  .ref{font-size:11px} .older{font-size:11px}
  .track{position:relative;height:14px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .seg{position:absolute;top:2px;bottom:2px;border-radius:2px;min-width:5px;opacity:.92}
  .seg:hover{opacity:1;outline:1px solid var(--ink2)}
  .seg.running{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .empty{text-align:center;padding:90px 0;color:var(--mut)}
  .empty h2{color:var(--ink2);font-weight:700}
  #drawer{display:none;position:fixed;inset:0;z-index:50}
  .d-back{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .d-panel{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:min(860px,94vw);
    background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:18px 20px;
    box-shadow:0 18px 60px rgba(0,0,0,.5)}
  .d-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .lane{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .lane-name{width:90px;font-size:11px;color:var(--mut);text-align:right}
  .lane-track{position:relative;flex:1;height:26px;background:var(--panel2);border-radius:4px}
  .jbar{position:absolute;top:3px;bottom:3px;border-radius:3px;color:#0c1210;font-family:var(--mono);
    font-size:10px;padding:2px 6px;overflow:hidden;white-space:nowrap}
  .jbar.failed{outline:2px solid var(--gl-red);color:var(--ink)}
  .jbar.hollow{position:static;display:inline-block;background:none;border:1px dashed var(--mut2);color:var(--mut)}
  .filters{display:flex;align-items:center;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
  .fchip{font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
  .fchip.on{color:var(--c);border-color:var(--c)}
  #gfilter{background:var(--panel);color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12px}
  .strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px}
  .strip-lane{display:flex;align-items:center;gap:10px;height:22px}
  .strip-lane .lane-track{height:18px;background:none}
  .dot{position:absolute;top:0;font-size:11px;transform:translateX(-50%)}
  .alist{display:flex;flex-direction:column;gap:2px}
  .aitem{display:flex;align-items:center;gap:6px 10px;padding:7px 12px;border-radius:6px;color:var(--ink2);font-size:13px;flex-wrap:wrap}
  .aitem:hover{background:var(--panel2);text-decoration:none}
  .proj{font-size:11px;min-width:min(150px,40vw)} .atitle{color:var(--ink)}
  .ver{color:var(--civo);border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:11px}
  .eco-summary{display:flex;align-items:center;gap:10px 14px;background:var(--panel);border:1px solid var(--line2);
    border-radius:8px;padding:12px 16px;margin:18px 0 8px;flex-wrap:wrap}
  .eco-summary .big{font-size:19px;font-weight:800;color:var(--ink)}
  .eco{display:flex;gap:14px;align-items:stretch;margin-top:14px;flex-wrap:wrap}
  .eco-col{flex:1;min-width:230px;display:flex;flex-direction:column;gap:10px}
  .eco-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gl-amber);font-weight:700;margin-bottom:2px}
  .eco-arrow{align-self:center;color:var(--mut2);font-size:22px;line-height:1}
  .ecard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .ecard.macro{border-color:var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
  .ec-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:nowrap}
  .ec-top .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ec-top .chip{flex:none}
  .ec-ver{font-size:12px;color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px}
  .ec-big{font-size:20px;font-weight:800;color:var(--ink);margin:2px 0 8px;word-break:break-all}
  .arrowlite{color:var(--mut2)}
  .vlbl{font-family:var(--sans);font-size:10px;color:var(--mut);letter-spacing:.04em}
  .vchip{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--ink2);white-space:nowrap}
  .vchip.mut{color:var(--mut)}
  /* first-load: the fox glides while the org is assembled (cold cache ~15s) */
  .boot{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
  .boot-sky{position:relative;width:340px;height:150px}
  .boot-fox{position:absolute;left:50%;top:52%;width:96px;height:72px;margin:-36px 0 0 -48px;animation:boot-glide 5.2s ease-in-out infinite;filter:drop-shadow(0 10px 22px rgba(0,201,80,.22))}
  .boot-trail{position:absolute;left:8%;right:8%;top:78%;height:2px;overflow:visible}
  .boot-trail i{position:absolute;top:0;width:26px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#00c95055);animation:boot-trail 2.6s linear infinite}
  .boot-trail i:nth-child(2){animation-delay:.9s;top:-10px;opacity:.6}
  .boot-trail i:nth-child(3){animation-delay:1.7s;top:9px;opacity:.4}
  .boot-word{font-weight:800;letter-spacing:.14em;font-size:15px;color:var(--ink);margin-top:2px}
  .boot-cap{font-family:var(--mono);font-size:12px;color:var(--mut);min-height:18px;margin-top:10px;transition:opacity .35s}
  .boot-cap.swap{opacity:0}
  .boot-bar{width:230px;height:3px;border-radius:3px;margin-top:14px;background:var(--line);overflow:hidden;position:relative}
  .boot-bar i{position:absolute;inset:0;width:38%;border-radius:3px;background:linear-gradient(90deg,transparent,#00c950,#05df72,transparent);animation:boot-shimmer 1.5s ease-in-out infinite}
  .boot-sub{font-size:10.5px;color:var(--mut2);margin-top:10px;font-family:var(--mono)}
  @keyframes boot-glide{0%,100%{transform:translate(-26px,6px) rotate(-7deg)}25%{transform:translate(0,-10px) rotate(2deg)}50%{transform:translate(26px,2px) rotate(7deg)}75%{transform:translate(2px,10px) rotate(-2deg)}}
  @keyframes boot-trail{0%{right:-6%;opacity:0}12%{opacity:1}100%{right:104%;opacity:0}}
  @keyframes boot-shimmer{0%{left:-40%}100%{left:102%}}
  @keyframes boot-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #view.booted > *{animation:boot-in .4s ease-out}
  @media (prefers-reduced-motion: reduce){.boot-fox,.boot-trail i,.boot-bar i{animation:none}.boot-trail{display:none}}
  .avatar{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);vertical-align:middle;flex:none;background:var(--panel2)}
  .env-app{font-size:10.5px;color:var(--civo);border:1px solid #14532d;border-radius:3px;padding:1px 7px;text-decoration:none;white-space:nowrap}
  .env-app:hover{filter:brightness(1.25)}
  .env-upd{font-size:10.5px;margin-top:7px}
  .env-hosts{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .hchip{font-size:10px;padding:2px 7px;border:1px solid var(--line);border-radius:9px;color:var(--ink2);
    text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.hchip:hover{border-color:var(--civo);color:var(--civo)}
  .hchip.hmut{color:var(--mut)}
  .hchip.hdead{color:var(--mut);border-style:dashed;text-decoration:line-through}
  .trig-ctl{display:inline-flex;align-items:center;gap:6px}
  .trig-armed{color:var(--gl-amber);border-color:var(--gl-amber);animation:trigpulse 1s ease-in-out infinite}
  @keyframes trigpulse{50%{filter:brightness(1.4)}}
  .trig-fb{font-size:10px;color:var(--civo);text-decoration:none;border:1px solid #14532d;border-radius:3px;padding:1px 6px;white-space:nowrap}
  .env-app.bumpmr{color:var(--gl-amber);border-color:#7c5a1d}
  .trig-fb.trig-err{color:var(--gl-red);border-color:var(--gl-red)}
  .live-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:11px}
  .ll-ref{color:var(--gl-amber);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av-s{width:15px;height:15px}
  .dv{font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:0 5px;text-decoration:none;white-space:nowrap}
  .dv-a{color:#fbbf24;border-color:#78560f}
  .dv-z{color:var(--mut2)}
  .ef-btn{background:none;border:none;color:var(--mut2);cursor:pointer;padding:0 2px;font-size:12px;line-height:1}
  .ef-btn:hover{color:var(--civo)}
  .ef-on{color:var(--civo)}
  .ef-clear{font-family:var(--mono);font-size:10px;color:var(--civo);background:none;border:1px solid var(--civo);border-radius:3px;padding:1px 7px;cursor:pointer;text-transform:none;letter-spacing:0}
  .stages{margin-top:9px}
  .pbar{height:8px;position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel2)}
  .pbar-fill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:4px;
    background:linear-gradient(90deg,#028a4b,var(--civo2) 60%,var(--civo));transition:width 1s linear}
  .pbar-fill.failed{background:linear-gradient(90deg,#7a1f12,var(--gl-red))}
  .pbar.indet .pbar-fill{width:26%;animation:slide 1.6s ease-in-out infinite alternate}
  @keyframes slide{from{left:0}to{left:74%}}
  .pbar-meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:4px}
  .pbar-meta .pj{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ec-msg{font-size:12px;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ec-msg a{color:var(--ink2)} .ec-msg a:hover{color:var(--civo)}
  .ec-sha{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;flex-wrap:wrap}
  .ec-sha>a{color:var(--civo)}
  .copy{background:none;border:1px solid var(--line);border-radius:4px;color:var(--mut);cursor:pointer;font-size:10px;padding:1px 5px;line-height:1.4}
  .copy:hover{color:var(--civo);border-color:var(--civo)}
  .pipebtn{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--c);
    border:1px solid var(--c);border-radius:4px;padding:2px 7px;opacity:.9;margin-left:2px}
  .pipebtn:hover{opacity:1;color:var(--c)}
  .ec-act{display:flex;gap:8px;margin-top:10px}
  .abtn{background:var(--panel2);border:1px solid var(--line2);border-radius:5px;color:var(--ink2);cursor:pointer;font-size:12px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
  .abtn:hover{border-color:var(--civo);color:var(--civo)}
  .abtn.warn:hover{border-color:var(--gl-orange);color:var(--gl-orange)}
  #actmodal{position:fixed;inset:0;z-index:60}
  #actmodal select,#actmodal input{background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--ink);display:block;margin:4px 0 12px;padding:6px 8px;width:100%;font-family:var(--mono);font-size:13px}
  #actmodal label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  #actmodal p{margin:0 0 14px;font-size:13px}
  .act-row{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
  .abtn .cd{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--gl-orange)}
  .abtn.arming{border-color:var(--gl-orange);color:var(--gl-orange)}
  .abtn.calm,.abtn.calm:hover{border-color:var(--line2);color:var(--ink2)}
  .cd-hint{margin:10px 0 0;font-size:12px}
  .pv-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gl-amber);margin-bottom:6px}
  .pv-svc{margin-bottom:8px}
  .pv-epic{display:inline-block;margin-left:8px;font-size:11px;color:var(--civo);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
  .pv-c{font-size:11px;margin-left:8px}
  .explain{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 8px;
    font-size:13px;color:var(--ink2);line-height:1.6}
  .br-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .br-repo{width:220px;flex:none;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .br-chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink2)}
  .br-chip:hover{border-color:var(--civo);color:var(--ink2)}
  .br-chip .mut{font-size:10.5px}
  .lane-epic{color:var(--civo)} .lane-hot{color:var(--gl-orange)}
  .br-tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag-main{color:var(--civo);border-color:var(--civo)}
  .tag-epic{color:var(--mut);border-color:var(--line2)}
  .br-name{color:var(--ink2)} .br-name:hover{color:var(--civo)}
  .br-act{padding:2px 6px;font-size:10px;gap:0}
  a.br-ahead{text-decoration:none}
  a.br-ahead:hover{filter:brightness(1.25)}
  .env-pending{opacity:.75;border-style:dashed}
  .verpick{background:var(--panel2);border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:2px 6px;max-width:100%}
  .verpick.picked{color:var(--civo);border-color:var(--civo);box-shadow:0 0 0 1px rgba(52,211,153,.25)}
  .macro-picked{border-color:var(--civo)}
  .macro-picked .btree{border-color:#14532d}
  .macro-picked .bt-ver{color:var(--civo)}
  .upin.picked{color:var(--civo);border-color:var(--civo)}
  .bf-chip{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:10.5px}
  .bf-feat{color:var(--civo);border-color:#14532d}
  .bf-hot{color:var(--gl-amber);border-color:#78560f}
  .pin-src{margin-left:2px;flex:none}
  .pipe-mini{font-size:9.5px;padding:1px 6px}
  .tf-ghost{color:var(--mut2)}
  .prom-wrap{margin-top:18px}
  .prom-row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin-bottom:6px;flex-wrap:wrap}
  .prom-name{color:var(--ink)}
  .pe{font-size:10.5px;border:1px solid;border-radius:3px;padding:1px 8px}
  .pe-direct{color:#34d399;border-color:#14532d;background:rgba(52,211,153,.07)}
  .pe-rc{color:#67e8f9;border-color:#155e63}
  .pe-miss{color:var(--mut2);border-color:var(--line)}
  .pe-none{color:#fbbf24;border-color:#78560f;background:rgba(251,191,36,.06)}
  .feat-g{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:0 0 10px}
  .copyname{cursor:pointer}
  .copyname:hover{color:var(--civo);text-decoration:underline dotted}
  .copied-toast{margin-left:6px;font-size:10px;color:var(--civo);animation:copiedfade 1.2s ease-out forwards;white-space:nowrap}
  @keyframes copiedfade{0%{opacity:0;transform:translateY(2px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  .feat-h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .feat-name{font-size:13px;color:var(--ink)}
  .fs-row{display:flex;align-items:center;gap:9px;padding:3px 0 3px 20px;font-size:12px;flex-wrap:wrap;row-gap:2px}
  .fs-name a{color:var(--ink2);text-decoration:none}
  .fs-name a:hover{color:var(--ink)}
  .fs-b{font-size:10px;border-radius:3px;padding:1px 7px;border:1px solid}
  .fs-upd{color:#34d399;border-color:#14532d;background:rgba(52,211,153,.07)}
  .fs-join{color:var(--mut);border-color:var(--line2)}
  .fs-main{color:var(--mut2);border-color:var(--line)}
  .fs-merged{color:#c4b5fd;border-color:#4c3a8f}
  .fs-mr{color:#93c5fd;text-decoration:none;font-size:10.5px;border:1px solid var(--line2);border-radius:3px;padding:1px 7px}
  .fs-mr:hover{filter:brightness(1.2)}
  .mr-draft{color:var(--mut);border-color:var(--line2)}
  .mr-ready{color:#34d399;border-color:#14532d}
  .mr-feedback{color:#fbbf24;border-color:#78560f}
  .mr-merged{color:#c4b5fd;border-color:#4c3a8f}
  .mr-closed{color:var(--mut2);border-color:var(--line)}
  .term{position:relative;margin-top:10px;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:12px}
  .term-c{color:var(--mut2);font-family:var(--mono)}
  .term-l{color:#7ee787;margin-top:2px;user-select:all}
  .term-copy{position:absolute;top:7px;right:8px}
  .lane-tag{font-size:9.5px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:1px 5px;letter-spacing:.04em}
  .tile-sec{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
  .tile-sec .ec-msg{margin:0 0 3px}
  .tf-h-row{display:flex;align-items:center;gap:6px;text-transform:uppercase}
  .tf-h-row .abtn{text-transform:none;letter-spacing:0}
  .tile-feats{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:4px}
  .tf-h{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);margin-bottom:2px}
  .tf-row{display:flex;align-items:center;gap:7px;font-size:11.5px;flex-wrap:wrap;row-gap:2px}
  .tf-ic{color:var(--mut2);display:inline-flex}
  .tf-ic svg{width:11px;height:11px}
  .tf-name{color:var(--ink2);text-decoration:none}
  .tf-name:hover{color:var(--ink)}
  .tile-feats .tf-row{min-width:0}
  .tile-feats .tf-name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<body>
<div class="wrap">
  <header>
    <a class="brand" href="#" id="brand"><svg viewBox="0 0 64 48" width="26" height="20" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05df72"/><stop offset=".55" stop-color="#00c950"/><stop offset="1" stop-color="#00a884"/></linearGradient></defs><path fill="url(#g)" d="M2 30 L14 8 L22 22 L32 20 L42 22 L50 8 L62 30 L32 44 Z"/><path fill="#12161d" opacity=".25" d="M32 20 L42 22 L32 44 Z"/><circle cx="26" cy="28" r="2.2" fill="#0b1220"/></svg>FOXGLIDER</a>
    <span id="ver" class="ver mono" title="theme build version"></span>
    <span id="org" class="orgchip mono" title="the org this view is scoped to"></span>

    <span class="spacer"></span>
    
    <span id="updated" class="mono mut"></span>
  </header>
  <main id="view">
    <div class="boot" id="boot">
      <div class="boot-sky">
        <div class="boot-trail"><i></i><i></i><i></i></div>
        <svg class="boot-fox" viewBox="0 0 64 48" aria-hidden="true"><defs><linearGradient id="gmb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05df72"/><stop offset=".55" stop-color="#00c950"/><stop offset="1" stop-color="#00a884"/></linearGradient></defs><path fill="url(#gmb)" d="M2 30 L14 8 L22 22 L32 20 L42 22 L50 8 L62 30 L32 44 Z"/><circle cx="26" cy="28" r="2.2" fill="#0b1220"/></svg>
      </div>
      <div class="boot-word">FOXGLIDER</div>
      <div class="boot-cap" id="boot-cap">waking the fox…</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-sub" id="boot-sub"></div>
    </div>
  </main>
  <div id="actmodal" style="display:none"></div>
  <footer class="sig">
    <svg class="sig-mark" viewBox="0 0 64 48" width="16" height="12" aria-hidden="true"><path fill="var(--civo)" d="M2 30 L14 8 L22 22 L32 20 L42 22 L50 8 L62 30 L32 44 Z"/></svg>
    <span class="sig-name">foxglider delivery theme</span>
    <span id="sig-ver" class="mono">—</span>
    <span class="sig-sep">·</span>
    <a id="sig-url" class="mono" target="_blank" rel="noopener" title="this theme instance"></a>
  </footer>
</div>
<script>
// focus (a feature OR hotfix branch) is deliberately session-only (never persisted): a reload always
// shows every epic — a forgotten filter must not cost visibility.
const state = { eco: null, act: null, focus: null };
const METAMARK = '<svg viewBox="0 0 64 48" width="20" height="15" aria-hidden="true" style="flex:none"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05df72"/><stop offset=".55" stop-color="#00c950"/><stop offset="1" stop-color="#00a884"/></linearGradient></defs><path fill="url(#gm)" d="M2 30 L14 8 L22 22 L32 20 L42 22 L50 8 L62 30 L32 44 Z"/><circle cx="26" cy="28" r="2.2" fill="#0b1220"/></svg>';
const $ = (s, el=document) => el.querySelector(s);

async function fetchJSON(url) {
  const res = await fetch(url);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw { status: res.status, error: body.error || res.statusText };
  return body;
}

const STATUS = { success:'var(--civo)', failed:'var(--gl-red)', running:'var(--gl-orange)',
  pending:'var(--gl-amber)', canceled:'var(--mut2)', skipped:'var(--mut2)', manual:'var(--manual)',
  created:'var(--gl-amber)', preparing:'var(--gl-amber)', waiting_for_resource:'var(--gl-amber)' };
const statusColor = s => STATUS[s] || 'var(--mut2)';

function relTime(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return `${s|0}s ago`;
  if (s < 3600) return `${s/60|0}m ago`;
  if (s < 86400) return `${s/3600|0}h ago`;
  return `${s/86400|0}d ago`;
}
const fmtDur = d => d >= 3600 ? `${d/3600|0}h${(d%3600)/60|0}m` : d >= 60 ? `${d/60|0}m${d%60|0}s` : `${d|0}s`;
const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

// errMsg coerces any thrown value — string, {error:"..."}, {error:{message}},
// Error, or plain object — into a readable line. Never yields "[object Object]".
function errMsg(e) {
  if (e == null) return 'unknown error';
  if (typeof e === 'string') return e;
  if (typeof e.error === 'string') return e.error;
  if (e.error && typeof e.error === 'object') return e.error.message || JSON.stringify(e.error);
  if (e.status) return `HTTP ${e.status}`;
  return e.message || JSON.stringify(e);
}

// First-load captions: staged to what the backend is really doing — the cold
// assembly walks every repo (branches, compares, pins, pipelines) and can take
// ~15s on a fresh pod. Cleared the moment the first payload renders.
(function bootCaptions() {
  const stages = [
    [0,  'waking the fox…'],
    [2,  'reading branches across the org…'],
    [5,  'computing drift vs main…'],
    [8,  'walking the umbrella pins…'],
    [11, 'checking the control planes…'],
    [15, 'first load on a cold pod — hang tight…'],
    [24, 'still assembling — GitLab is being thorough…'],
  ];
  const t0 = Date.now();
  const cap = document.getElementById('boot-cap'), sub = document.getElementById('boot-sub');
  const tick = setInterval(() => {
    if (!document.getElementById('boot')) { clearInterval(tick); return; }
    const el = (Date.now() - t0) / 1000;
    let msg = stages[0][1];
    for (const [at, m] of stages) if (el >= at) msg = m;
    if (cap && cap.textContent !== msg) {
      cap.classList.add('swap');
      setTimeout(() => { cap.textContent = msg; cap.classList.remove('swap'); }, 350);
    }
    if (sub && el >= 6) sub.textContent = Math.floor(el) + 's';
  }, 1000);
})();
function showDisconnected(err) {
  $('#view').innerHTML = `<div class="empty">
    <img src="foxglider.svg" alt="" width="120" style="opacity:.5;margin-bottom:14px" />
    <h2>Not connected to GitLab</h2>
    <p class="mono mut">${esc(errMsg(err))}</p></div>`;
}

const verChip = v => v ? `<span class="vchip mono">${esc(v)}</span>` : `<span class="vchip mono mut">—</span>`;
function statusChip(pl) {
  if (!pl) return '<span class="chip" style="--c:var(--mut2)">no pipeline</span>';
  return `<a class="chip" target="_blank" href="${pl.web_url}" style="--c:${statusColor(pl.status)}">${esc(pl.status)}</a>`;
}
// avatarImg shows who pushed the change behind the latest pipeline.
function avatarImg(pl) {
  if (!pl || !pl.author_avatar) return '';
  return `<img class="avatar" src="${pl.author_avatar}" alt="" title="${esc(pl.author_name || 'someone')} — pushed the latest change">`;
}
// miniAv: a small last-committer avatar for branch rows — who's changing what.
function miniAv(name, url) {
  if (!url) return '';
  return `<img class="avatar av-s" src="${url}" alt="" loading="lazy" title="${esc(name || 'someone')} — last commit">`;
}
// divChip: ↑ahead ↓behind vs main, linked to the GitLab compare when known.
function divChip(x) {
  if (!x || (x.ahead == null && x.behind == null)) return '';
  const t = `↑${x.ahead ?? '?'} ↓${x.behind ?? '?'}`;
  const cls = (x.ahead | 0) > 0 ? 'dv-a' : 'dv-z';
  const title = `${x.ahead ?? '?'} commit(s) ahead of main · ${x.behind ?? '?'} behind`;
  return x.compare_url
    ? `<a class="dv ${cls} mono" target="_blank" href="${x.compare_url}" title="${title} — open the compare">${t}</a>`
    : `<span class="dv ${cls} mono" title="${title}">${t}</span>`;
}

// Live stage-progress: only running pipelines are polled, and only while they run.
const isRunning = pl => !!pl && ['running', 'pending', 'created', 'waiting_for_resource'].includes(pl.status);

// commitLine: the human story on a card — the commit message with its time,
// then the short SHA (linked + copyable) and the SHA's full pipeline story.
const ICON_PIPE = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h5.5A2.5 2.5 0 0 1 18 9v5"/></svg>';
function commitLine(n) {
  const c = n.commit, pl = n.pipeline;
  if (!c) return '';
  const t = (pl && (pl.finished_at || pl.updated_at)) || c.authored_at;
  return `<div class="ec-msg" title="${esc(c.title)} — ${esc(c.author_name || '')}">
      <a target="_blank" href="${c.web_url}">${esc(c.title)}</a><span class="mut"> · ${relTime(t)}</span></div>
    <div class="ec-sha mono">
      <span class="lane-tag" title="everything in this block — commit, sha, pipeline, trigger, release — is the main branch">main</span>
      <a target="_blank" href="${c.web_url}" title="view commit">${esc(c.short_sha)}</a>
      <button class="copy" data-sha="${esc(c.sha)}" title="copy full sha">⧉</button>
      ${pl ? `<a class="pipebtn" target="_blank" href="${pl.web_url}" style="--c:${statusColor(pl.status)}"
        title="pipeline #${pl.id} · ${esc(pl.ref)} · ${pl.status}">${ICON_PIPE} pipeline</a>` : ''}
    </div>`;
}
// copy-to-clipboard with an execCommand fallback (clipboard API can be denied
// inside the konstruct iframe).
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}
// epic focus: click ◎ on any feature row (or the ✕ chip) to toggle a
// session-only filter — reloads always show everything.
document.addEventListener('click', e => {
  const f = e.target.closest('[data-focus]'); if (!f) return;
  const br = f.dataset.focus;
  state.focus = state.focus === br ? null : br;
  if (state.eco) renderDelivery(state.eco);
});
// clicking a branch name copies it to the clipboard, with a brief confirmation.
document.addEventListener('click', e => {
  const n = e.target.closest('.copyname'); if (!n) return;
  const txt = n.dataset.copytext || n.textContent || '';
  const flash = () => {
    const t = document.createElement('span');
    t.className = 'copied-toast'; t.textContent = 'copied \u2713';
    n.after(t); setTimeout(() => t.remove(), 1200);
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(txt).then(flash, () => { fallbackCopy(txt); flash(); });
  else { fallbackCopy(txt); flash(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const done = ok => { b.textContent = ok ? '✓' : '✗'; setTimeout(() => { b.textContent = '⧉'; }, 1200); };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(b.dataset.sha).then(() => done(true), () => done(fallbackCopy(b.dataset.sha)));
  else done(fallbackCopy(b.dataset.sha));
});
function stagesSlot(node) {
  const pl = node && node.pipeline;
  if (!pl) return '';
  const key = `${node.project}:${pl.id}`;
  const recent = progCache.has(key) && (Date.now() - (progCache.get(key)._at || 0)) < 25000;
  if (!isRunning(pl) && !recent) return '';
  return `<div class="stages" data-proj="${esc(node.project)}" data-pid="${pl.id}"></div>`;
}
let progressGen = 0;
const progCache = new Map(); // "proj:pid" → last progress snapshot
const progMax = new Map();   // "proj:pid" → high-water pct: a progress bar only climbs
function monoPct(key, pct) {
  const hi = Math.max(progMax.get(key) || 0, pct);
  progMax.set(key, hi);
  return hi;
}
function startProgressPollers() {
  const gen = ++progressGen; // supersede pollers from any previous render
  document.querySelectorAll('.stages[data-pid]').forEach(el => {
    const cached = progCache.get(`${el.dataset.proj}:${el.dataset.pid}`);
    if (cached) paintStages(el, cached); // instant — no blank flash on re-render
    pollProgress(el, gen);
  });
}
function paintStages(el, d) {
  const m = computeProgress(d);
  const b = barState(m);
  const key = `${el.dataset.proj}:${el.dataset.pid}`;
  if (m.running) { b.pct = monoPct(key, b.pct); b.right = `${b.pct | 0}%${b.right.slice(b.right.indexOf(' ·'))}`; }
  const failed = d.status === 'failed';
  el.innerHTML = `
    <div class="pbar${b.indet ? ' indet' : ''}" title="${esc(barTitle(d))}">
      <div class="pbar-fill${failed ? ' failed' : ''}" style="width:${b.indet ? '' : b.pct + '%'}"></div>
    </div>
    <div class="pbar-meta"><span class="pj">${esc(b.label)}</span><span>${esc(b.right)}</span></div>`;
  el.dataset.key = `${el.dataset.proj}:${el.dataset.pid}`;
}
// ONE progress bar per running pipeline: 0→100 against the previous
// successful run's timings. Done stages bank their actual time, the running
// job advances against its own baseline, queued stages are known runway.
const STG_DONE = ['success', 'failed', 'canceled', 'skipped'];
function computeProgress(d) {
  let doneS = 0, totalS = 0, running = null, blind = false;
  for (const st of (d.stages || [])) {
    if (st.status === 'manual' || st.status === 'skipped') continue; // gates + [skip ci] noise aren't runway
    const jobs = st.jobs || [];
    const exp = Math.max(0, ...jobs.map(j => j.expected_s || 0), st.running?.expected_s || 0);
    const act = Math.max(0, ...jobs.map(j => j.duration_s || 0));
    if (STG_DONE.includes(st.status)) { const v = act || exp; doneS += v; totalS += v; }
    else if (st.running) { running = { ...st.running, exp }; totalS += exp; if (!exp) blind = true; }
    else { totalS += exp; if (!exp) blind = true; }
  }
  return { doneS, totalS, running, blind, status: d.status };
}
function barState(m) {
  if (!m.running) {
    const done = m.status === 'success' || m.status === 'failed';
    return { pct: done ? 100 : 0, label: m.status, right: m.totalS ? fmtDur(m.totalS) : '' };
  }
  const el = m.running.started_at ? (Date.now() - new Date(m.running.started_at)) / 1000 : 0;
  const num = m.doneS + Math.min(el, m.running.exp || el);
  const den = m.totalS + (m.running.exp ? 0 : el);
  const pct = den > 0 ? Math.min(97, num / den * 100) : 0;
  const eta = m.blind || !den ? '' : ` / ~${fmtDur(den)}`;
  return { pct, label: `▸ ${m.running.name}`, right: `${pct | 0}% · ${fmtDur(m.doneS + el)}${eta}`, indet: m.blind && !m.running.exp };
}
function barTitle(d) {
  return (d.stages || []).map(st => `${st.name}: ${st.status}` +
    ((st.jobs || []).length ? ` (${st.jobs.map(j => j.name + (j.duration_s ? ` ${fmtDur(j.duration_s)}` : '')).join(', ')})` : '')).join('  ·  ');
}
async function pollProgress(el, gen) {
  if (gen !== progressGen || !el.isConnected) return;
  try {
    const d = await fetchJSON(`/api/pipeline-progress?project=${encodeURIComponent(el.dataset.proj)}&id=${el.dataset.pid}`);
    d._at = Date.now();
    progCache.set(`${el.dataset.proj}:${el.dataset.pid}`, d);
    if (el.isConnected) paintStages(el, d);
    // keep polling while the PIPELINE runs (the tile status says so) — the
    // job rollup alone can read "success" while a deploy bridge still runs
    if (gen === progressGen) setTimeout(() => pollProgress(el, gen), 5000);

    }, 1000);
  };
  document.onkeydown = (e) => { if (e.key === 'Escape') { if (actCountdown) disarm('no worries — no hotfix cut.'); else closeActModal(); } };
}

let actCountdown = null;
function cancelCountdown() { if (actCountdown) { clearInterval(actCountdown); actCountdown = null; } }
function closeActModal() { cancelCountdown(); document.onkeydown = null; $('#actmodal').style.display = 'none'; $('#actmodal').innerHTML = ''; }

let pollTimer;
// After an action fires, poll fast for two minutes: the trigger job takes
// ~30-40s to push its commit, and the backend fast-lanes the project's cache
// over the same window — together the tile picks up the new SHA in seconds.
function poll() {
  clearTimeout(pollTimer);
  const burst = Date.now() < (state.burstUntil || 0);
  const gap = burst ? 5000 : (state.reconnecting ? 8000 : 20000);
  pollTimer = setTimeout(async () => { if (!document.hidden) await refresh(); poll(); }, gap);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });


loadMeta(); loadActions().then(refresh); poll();
</script>
</body>
</html>
